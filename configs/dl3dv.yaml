# DL3DV training (paper setting) and the model definition used for inference / evaluation.
model:
  class_name: model.mvssl.MVSSL
  image_tokenizer:
    image_size_h: 256
    image_size_w: 256
    patch_size: 16
  transformer:
    d: 768
    d_head: 64
    n_layer: 12
    used_by_DPT_idx: [5, 7, 9, 11]   # transformer layers read by the DPT head
  gaussians:
    sh_degree: 0
    scaling_bias: -3.0
    scaling_max: -2.0
    opacity_bias: -2.0
    range_setting:                    # depth along the ray = sigmoid(t) * (far - near) + near
      type: linear_depth
      near: 0.0
      far: 8.0

training:
  # ---- paths -------------------------------------------------------------
  pixio_ckpt: ./checkpoints/pixio_vitb16.pth             # Pixio ViT-B/16 (encoder init + frozen semantic target)
  vgg_ckpt: ./checkpoints/imagenet-vgg-verydeep-19.mat   # downloaded automatically if missing
  checkpoint_dir: ./experiments/dl3dv
  resume_ckpt: ""                                        # empty: resume from the latest ckpt in checkpoint_dir
  reset_training_state: false

  # ---- data --------------------------------------------------------------
  # Variable view count: one bucket per batch. Each bucket of N views is split into
  # (N+1)/2 context and (N-1)/2 held-out views (data/view_buckets.py:split_counts).
  num_views_buckets:  [5, 7, 9, 11]
  batch_size_per_gpu: [24, 20, 16, 12]
  train_dataset:
    class_name: data.dataset_dl3dv.Dataset
    dataset_path: ./data/dl3dv10k_train.txt
    data_root: /path/to/dl3dv          # <data_root>/<scene_id>/opencv_cameras.json
    view_selector:
      stratified: true                 # one interior view per equal-width bin of the clip
      # Frame span of the largest bucket; smaller buckets scale it by num_views / 11.
      # Widened over the first curriculum_iter steps from the start span to the final one.
      min_frame_dist: 32
      max_frame_dist: 48
      use_curriculum: true
      curriculum_iter: 80000
      curriculum_start_min_frame_dist: 24
      curriculum_start_max_frame_dist: 32
  eval_datasets:                       # in-run pose eval (rank 0); remove to disable
    - tag: dl3dv
      class_name: data.dataset_dl3dv.Dataset
      dataset_path: ./data/dl3dv10k_benchmark.txt
      data_root: /path/to/dl3dv_benchmark
      view_selector:
        max_frame_dist: 48
  eval_num_views: [10]
  eval_every: 10000
  square_crop: true
  scene_scale_factor: 1.35
  num_workers: 8
  prefetch_factor: 4
  num_threads: 8

  # ---- objective: L = L_nvs + lambda_align * L_align + lambda_sem * L_sem ----
  mse_loss_weight: 1.0
  perceptual_loss_weight: 0.2
  sem_loss_weight: 0.2                 # lambda_sem
  align_loss_weight: 0.1               # lambda_align
  align_warmup_start: 40000            # lambda_align is 0 before this step,
  align_warmup_iter: 20000             # then ramps linearly to align_loss_weight
  align_layer_idx: [5, 7, 9, 11]
  sparse_views_buckets: [3, 5, 7, 9]   # sparse-context size per bucket (2 views dropped, 1 per side)
  ema_decay: 0.999

  # ---- optimization --------------------------------------------------------
  train_steps: 100000
  lr: 0.0001
  warmup: 3000
  scheduler_type: cosine
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.05
  grad_clip_norm: 1.0
  allowed_gradnorm_factor: 5.0         # skip the step if the grad norm exceeds 5x the clip
  no_pass_steps: 500                   # ... but never during the first 500 steps
  use_amp: true
  amp_dtype: bf16
  use_tf32: true

  # ---- logging ---------------------------------------------------------------
  checkpoint_every: 10000
  print_every: 20
  wandb_project: ""                    # set to log to wandb
  api_key_path: ./configs/api_keys.yaml   # wandb API key (or set WANDB_API_KEY)
  wandb_exp_name: dl3dv
  wandb_log_every: 50
